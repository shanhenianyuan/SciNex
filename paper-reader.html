<script src="/pdf.min.js"></script>
<style>
:root{--bg:#eef1f4;--pn:#fff;--pn2:#f6f8fa;--ink:#1b2631;--mut:#69788a;--ln:#dde3ea;--ac:#2c6e74;--ac2:#e4f1f1;--hl:#f2b544;--bad:#c0463d;--rd:10px}
@media(prefers-color-scheme:dark){:root{--bg:#12171c;--pn:#1a2128;--pn2:#202932;--ink:#e3e9ef;--mut:#8a98a8;--ln:#2b3640;--ac:#59b3ba;--ac2:#1d3338;--hl:#d9a03a;--bad:#e0766d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.55 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.ghost{background:none;border-color:transparent}button.ghost:hover{background:var(--pn2)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,textarea,select{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:6px 9px;width:100%}
#app{display:grid;grid-template-columns:var(--lw,260px) 1fr var(--rw,400px);height:100%}
#app.nolib{--lw:0px}#app.nolib #lib{display:none}
aside,main,#qa{background:var(--pn);min-height:0;display:flex;flex-direction:column;overflow:hidden}
#lib{border-right:1px solid var(--ln)}#qa{border-left:1px solid var(--ln);position:relative}
.hd{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--ln);min-height:50px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;flex:1 1 100%;min-width:0;cursor:default}
.brand svg{width:24px;height:24px;flex:none}
.brand .nm{font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand .nm small{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:4px;letter-spacing:.06em}
.hd button{flex:none;margin-top:4px}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:8px 12px 0}
.chip{padding:1px 9px;border-radius:99px;border:1px solid var(--ln);font-size:12px;cursor:pointer;background:none}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
#list{flex:1;overflow:auto;padding:8px}
.it{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;position:relative}
#ols{border-top:1px solid var(--bd,#dde3e8);margin-top:8px;padding-top:6px}
#ols .olh{font-size:12px;color:var(--mut,#7a8a94);padding:6px 10px 2px}
#ols .it small{margin-top:2px}
.it:hover{background:var(--pn2)}.it.on{background:var(--ac2);border-color:var(--ac)}
.it b{display:block;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:2px}
.it small{color:var(--mut);font-size:12px}.tag{background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:0 5px;margin-right:4px;font-size:11px;color:var(--mut)}
.ops{display:none;position:absolute;right:4px;top:4px;background:var(--pn);border-radius:7px}.it:hover .ops{display:flex}.ops button{padding:1px 6px;border:0;background:none}
.st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--ln)}.st.r1{background:var(--hl)}.st.r2{background:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:28px 14px}
.tb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.tb input[type=number]{width:58px}.tb .sp{flex:1}.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
#scroll{flex:1;overflow:auto;background:var(--bg);padding:18px 0;position:relative}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px}
.page{position:relative;background:#fff;box-shadow:0 1px 6px #0003;flex:none}
.page canvas{display:block;width:100%;height:100%}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1}
.textLayer span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0}
.textLayer ::selection{background:#f2b54488}
.region #pages .page{cursor:crosshair}.region .textLayer{pointer-events:none}
.rect{position:absolute;border:2px solid var(--hl);background:#f2b54430;pointer-events:none;border-radius:3px}
#fab{position:fixed;z-index:20;display:none;gap:2px;background:var(--ink);padding:4px;border-radius:9px;box-shadow:0 4px 18px #0005}
#fab button{background:none;border:0;color:var(--bg);padding:4px 9px}#fab button:hover{background:#ffffff26}#fab button[data-close]{margin-left:3px;padding-left:9px;border-left:1px solid #ffffff33;opacity:.85}#fab button[data-close]:hover{opacity:1;background:#ffffff26}
.drop{margin:auto;text-align:center;color:var(--mut);padding:40px}.drop h2{color:var(--ink);margin:0 0 6px}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;border:0;border-radius:0;background:none;padding:12px;border-bottom:2px solid transparent}
.tabs button.on{border-bottom-color:var(--ac);color:var(--ac);font-weight:600}
.pane{flex:1;display:none;flex-direction:column;min-height:0}.pane.on{display:flex}
#msgs,#notes{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.m.user{align-self:flex-end;background:var(--ac);color:#fff}.m.assistant{align-self:flex-start;background:var(--pn2);border:1px solid var(--ln)}
.m pre{background:#0002;padding:8px;border-radius:6px;overflow:auto;margin:6px 0;white-space:pre}.m code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.m li{display:list-item;margin-left:1.3em}.m h4{display:inline;margin:0}.think{color:var(--mut);font-size:12.5px}
.q{border-left:3px solid var(--hl);padding:2px 8px;margin-bottom:6px;font-size:12.5px;opacity:.95;max-height:90px;overflow:auto}.m.user .q{border-color:#fff8}
.m img,.att img{max-width:100%;border-radius:6px;display:block;margin-bottom:6px}
.act{align-self:flex-start;margin-top:-6px}.act button{font-size:12px;padding:1px 8px;margin-right:4px}
.att{margin:0 12px;padding:8px;border:1px dashed var(--hl);border-radius:var(--rd);background:var(--pn2);position:relative;max-height:170px;overflow:auto}
.att small{color:var(--mut);display:block}.att .x{position:absolute;right:4px;top:4px;padding:0 7px}
.box{padding:10px 12px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:7px}
.box .row{display:flex;gap:7px;align-items:flex-end}.box textarea{resize:none;height:60px}
.note{border:1px solid var(--ln);border-radius:var(--rd);padding:9px 10px;background:var(--pn2)}
.note .q{cursor:pointer}.note textarea{border:0;background:none;padding:2px 0;min-height:44px;resize:vertical}.note .meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
#grip{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}#grip:hover{background:var(--ac2)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--pn);border-radius:14px;padding:20px;width:min(580px,94vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:16px}.dlg label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px}.dlg .r{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:9px;display:none;z-index:99}
@media(max-width:1000px){#app{grid-template-columns:0 1fr 340px}#lib{display:none}#app.showlib{grid-template-columns:240px 1fr 0}#app.showlib #lib{display:flex}#app.showlib #qa{display:none}}
.inf{margin-top:8px;font-size:12.5px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:7px 9px}.inf .g{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 10px}.inf span{color:var(--mut)}.inf .w{color:var(--bad);margin-top:5px}
</style></head><body>
<div id="app">
<aside id="lib">
 <div class="hd"><span class="brand"><svg viewBox="0 0 128 128" fill="none"><circle cx="64" cy="64" r="58" fill="var(--ac2)" stroke="var(--ac)" stroke-width="5"/><circle cx="64" cy="64" r="20" fill="var(--ac)"/><path d="M64 44 C64 34 60 30 52 28" stroke="var(--ac)" stroke-width="5" stroke-linecap="round"/><path d="M64 84 C64 94 60 98 52 100" stroke="var(--ac)" stroke-width="5" stroke-linecap="round"/><path d="M44 64 C34 64 30 60 28 52" stroke="var(--ac)" stroke-width="5" stroke-linecap="round"/><path d="M84 64 C94 64 98 60 100 52" stroke="var(--ac)" stroke-width="5" stroke-linecap="round"/><circle cx="52" cy="28" r="9" fill="var(--ac)"/><circle cx="52" cy="100" r="9" fill="var(--ac)"/><circle cx="28" cy="52" r="9" fill="var(--ac)"/><circle cx="100" cy="52" r="9" fill="var(--ac)"/><circle cx="64" cy="64" r="8" fill="#fff"/></svg><span class="nm">SciNex<small>RESEARCH</small></span></span><button class="pri" id="imp">导入 PDF / Word</button><button class="ghost" id="setb" title="模型设置">⚙</button></div>
 <div style="padding:8px 12px 0"><input id="q" placeholder="搜索标题或标签"></div>
 <div class="chips" id="flt"></div>
 <div id="list"></div>
 <div id="ols" style="display:none"></div>
 <input type="file" id="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
</aside>
<main>
 <div class="tb">
  <button class="ghost" id="tl" title="显示/隐藏论文库">☰</button>
  <div class="seg"><button id="mT" class="on" title="拖选文字">选文字</button><button id="mR" title="拖出矩形区域，可含公式与图表">框选区域</button></div>
  <span class="sp"></span>
  <button class="ghost" id="zo">−</button><span id="zl">120%</span><button class="ghost" id="zi">＋</button><button class="ghost" id="zf">适应宽度</button>
  <input type="number" id="pn" min="1" value="1"><span id="pt">/ 0</span>
 </div>
 <div id="scroll"><div id="pages"></div>
  <div class="drop" id="dz"><h2>把论文拖到这里</h2><p>支持 PDF 或 Word（.docx/.doc）。导入后会保存在本机浏览器中，随时回来继续读。</p></div>
 </div>
</main>
<section id="qa">
 <div id="grip"></div>
 <div class="tabs"><button id="t1" class="on">问答</button><button id="t2">笔记 <span id="nc"></span></button><button id="t3">知识网</button></div>
 <div class="pane on" id="p1">
  <div id="msgs"></div>
  <div id="attw"></div>
  <div class="box">
   <div class="row" style="justify-content:space-between;align-items:center"><label style="color:var(--mut);font-size:12.5px"><input type="checkbox" id="ctx" style="width:auto" checked> 带上论文全文作背景</label><span><button class="ghost" id="clr">清空对话</button></span></div>
   <div class="row" style="justify-content:space-between;align-items:center;padding:2px 0"><span><button id="deepz" title="一键深度分析整篇论文：研究背景 / 研究内容 / 核心创新 / 运行原理细节及步骤 / 遗留问题" style="border-color:var(--ac);color:var(--ac);font-weight:600;background:var(--pn2)">🧭 一键解读</button></span><span id="route" style="font-size:12px;color:var(--mut)"></span></div>
   <div id="ags" style="display:none;font-size:12px;color:var(--ac);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div class="row"><textarea id="inp" placeholder="问问这篇论文… 或先在左侧框选内容再提问（Enter 发送，Shift+Enter 换行）"></textarea><button class="pri" id="send">发送</button></div>
  </div>
 </div>
 <div class="pane" id="p2">
  <div class="box" style="border:0;border-bottom:1px solid var(--ln)"><textarea id="nt" placeholder="记录当前阅读的想法（会自动记下页码）"></textarea><div class="row" style="justify-content:space-between"><button id="nx">导出 Markdown</button><button class="pri" id="na">添加笔记</button></div></div>
  <div id="notes"></div>
 </div>
 <div class="pane" id="p3">
  <div class="box" style="border:0;border-bottom:1px solid var(--ln);flex:none">
   <div style="display:flex;justify-content:space-between;align-items:center"><b>知识网 · 前驱 → 本文 → 后续</b><button class="ghost" id="kgAuto">自动提取引用</button></div>
   <div class="row"><label style="width:64px;color:var(--mut);font-size:12.5px">论文标题</label><input id="kgT" placeholder="如 Attention Is All You Need"></div>
   <div style="position:relative"><label style="color:var(--mut);font-size:12.5px">参考文献标题（每行一条，最多 12 条；可用「自动提取引用」从全文抽取后编辑）</label><textarea id="kgR" rows="5" style="height:auto" placeholder="[1] Sutskever I. Sequence to sequence learning with neural networks. 2014. 每行一条…"></textarea></div>
   <div class="row" style="justify-content:space-between;align-items:center"><small id="kgS" style="color:var(--mut)">点击节点查看核心内容与存在问题</small><button class="pri" id="kgB">构建知识网</button></div>
  </div>
  <div id="kgscroll" style="flex:1;overflow:auto;padding:12px"><div id="kgv"></div><div id="kgd" style="margin-top:10px;padding:10px;background:var(--pn2);border:1px solid var(--ln);border-radius:8px;display:none"></div></div>
 </div>
</section>
</div>
<div id="fab"><button data-a="ask">问 AI</button><button data-a="explain">解释</button><button data-a="trans">翻译</button><button data-a="citeref">分析引用</button><button data-a="research">深度调研</button><button data-a="note">记笔记</button><button data-close title="关闭工具条">✕</button></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
addEventListener('error',e=>{toast('错误：'+(e.message||e.type));console.error('[gef]',e.error||e)});
addEventListener('unhandledrejection',e=>{toast('异步错误：'+(e.reason&&e.reason.message||e.reason));console.error('[gur]',e.reason)});
/* ---------- 设置 ---------- */
const DEF={models:[{id:'txt',name:'DeepSeek-V4-1-Flash（文本）',url:'/llm/v1',key:'',model:'deepseek-v4-1-flash',vision:false,noThink:true},{id:'vis',name:'Qwen3-VL-4B（多模态）',url:'/vis/v1',key:'',model:'qwen3-vl-4b-instruct',vision:true},{id:'agent',name:'智能体（联网查证）',url:'/agent/v1',key:'',model:'deepseek-v4-1-flash',vision:false,agent:true}],textId:'txt',visId:'vis',sys:'你是一名严谨的科研助手，帮助用户阅读学术论文。请用中文回答，必要时保留英文术语，回答要准确、简洁，并尽量指出对应的页码或章节。',max:24000,temp:0.3};
let cfg={...DEF};try{Object.assign(cfg,JSON.parse(localStorage.getItem('pr_cfg')||'{}'))}catch(e){}
if(!Array.isArray(cfg.models))cfg.models=[];
if(!cfg.models.length&&cfg.url){const id=uid();cfg.models.push({id,name:cfg.model||'默认模型',url:cfg.url,key:cfg.key||'',model:cfg.model||'',vision:false});cfg.textId=id}
if(!cfg.store)cfg.store='browser'; /* browser=存浏览器(IndexedDB) | local=另存本机目录 */
if(typeof cfg.storePath!=='string')cfg.storePath='';
if(!cfg.models.some(m=>m.id==='agent'))cfg.models.push({id:'agent',name:'智能体（联网查证）',url:'/agent/v1',key:'',model:'deepseek-v4-1-flash',vision:false,agent:true});
/* 迁移:服务端文本/agent 模型已由 qwen333 网关切到 deepseek-v4-1-flash */
cfg.models.forEach(m=>{
  if(m.id==='txt'){m.url='/llm/v1';m.model='deepseek-v4-1-flash';m.name='DeepSeek-V4-1-Flash（文本）';m.vision=false;m.noThink=true;m.agent=false}
  if(m.id==='agent'){m.url='/agent/v1';m.model='deepseek-v4-1-flash';m.vision=false;m.agent=true}
});
const mById=id=>cfg.models.find(m=>m.id===id);
const getVis=()=>mById(cfg.visId)||cfg.models.find(m=>m.vision)||null;
const getTxt=()=>mById(cfg.textId)||cfg.models.find(m=>!m.vision)||cfg.models[0]||null;
const pick=img=>img?getVis():(getTxt()||getVis());
const fk=n=>n?(n>=1024?(n/1024).toFixed(1).replace('.0','')+'K':String(n)):'—';
const ctxOf=m=>(m&&m.info&&m.info.ctx)||8192;
const est=t=>{let c=0;for(const ch of t)c+=ch.charCodeAt(0)>0x2e80?1.1:.28;return Math.ceil(c)};
function renderRoute(){const T=pick(false),V=pick(true),n=m=>m?`<b>${esc(m.name||m.model)}</b> <small>(${fk(ctxOf(m))})</small>`:'<b>未配置</b>';$('#route').innerHTML=`自动分流：文字提问 → ${n(T)} ｜ 图片提问 → ${n(V)}`}
async function detect(m){
 const base=m.url.trim().replace(/\/+$/,''),root=base.replace(/\/v1$/,''),A=m.key?{Authorization:'Bearer '+m.key}:{};
 const J=async(u,body)=>{const r=await fetch(u,body?{method:'POST',headers:{...A,'Content-Type':'application/json'},body:JSON.stringify(body)}:{headers:A});if(!r.ok)throw 0;return r.json()};
 const I={backend:'未知',t:Date.now()};
if(m.agent){I.backend='智能体（自建代理：联网查证后作答）';I.ctx=8192;I.agent=true;return I}
 try{const j=await J(root+'/api/show',{model:m.model,name:m.model}),mi=j.model_info||{},k=Object.keys(mi).find(x=>x.endsWith('.context_length')),d=j.details||{};
  Object.assign(I,{backend:'Ollama',maxCtx:k?mi[k]:0,arch:mi['general.architecture']||d.family,params:d.parameter_size,quant:d.quantization_level});
  if(j.capabilities)I.vision=j.capabilities.includes('vision');
  const pm=/num_ctx\s+(\d+)/.exec(j.parameters||'');I.runCtx=pm?+pm[1]:0;
  try{const ps=await J(root+'/api/ps'),x=(ps.models||[]).find(x=>x.name===m.model||x.model===m.model);if(x&&x.context_length)I.runCtx=x.context_length}catch(e){}
  I.runCtx=I.runCtx||Math.min(I.maxCtx||4096,4096);I.ctx=I.runCtx;return I}catch(e){}
 try{const j=await J(root+'/api/v0/models'),x=(j.data||[]).find(x=>x.id===m.model);if(!x)throw 0;
  Object.assign(I,{backend:'LM Studio',maxCtx:x.max_context_length,runCtx:x.loaded_context_length||0,arch:x.arch,quant:x.quantization,vision:x.type==='vlm'});I.ctx=I.runCtx||I.maxCtx;return I}catch(e){}

async function saveToLocal(p){

    let b64='';const bytes=new Uint8Array(buf);const CHUNK=0x8000;
    for(let i=0;i<bytes.length;i+=CHUNK){b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+CHUNK))}
    b64=btoa(b64);
    const r=await fetch('/save/v1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir,name,b64})});
    const j=await r.json();
    if(j.saved){toast('已另存本机：'+name)}else{console.warn('saveToLocal fail',j)}
  }catch(e){console.warn('saveToLocal err',e.message)}
}

   try{const r=await fetch(m.url.trim().replace(/\/+$/,'')+'/models',{headers:m.key?{Authorization:'Bearer '+m.key}:{}});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),ids=(j.data||j.models||[]).map(x=>x.id||x.name);c.querySelector('datalist').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');if(!m.model&&ids[0]){m.model=ids[0];c.querySelector('[data-f=model]').value=ids[0]}s.textContent='✓ 可用，'+ids.length+' 个模型（点模型名框选择）';scan(m)}catch(er){s.textContent='✗ '+er.message}}});
 const scan=async m=>{const fnd=()=>g(`[data-i="${W.models.indexOf(m)}"]`);if(!m.url||!m.model||!fnd())return;fnd().querySelector('.inf').textContent='正在识别模型信息…';const first=!m.info,I=await detect(m);m.info=I;const c=fnd();if(!c)return;

/* ---------- 知识网（/kg/v1） ---------- */
function kgPrefill(){if(S.cur){const t=$('#kgT');t.value=S.cur.title;t.placeholder=S.cur.title}}
function kgAuto(){
 if(!S.cur){toast('请先打开一篇论文');return}
 const t=S.text||'';if(!t){toast('暂无全文文本，请手工粘贴参考文献标题');return}
 let idx=Math.max(t.lastIndexOf('References'),t.lastIndexOf('Bibliography'),t.lastIndexOf('参考文献'),t.lastIndexOf('REFERENCES'));
 if(idx<0)idx=Math.max(0,t.length-5000);
 let tail=t.slice(idx).replace(/\n\[第\d+页\]\n/g,' ');
 const parts=tail.split(/\.\s+(?=[A-Z0-9"([])/).map(x=>x.trim()).filter(x=>x.length>=18&&x.length<=200);
 const refs=[],seen=new Set();
 for(const p of parts){let r=p.replace(/^\[?\d+[.\]]?\s+/,'').trim();if(r.length<15||r.length>180)continue;if(seen.has(r))continue;seen.add(r);refs.push(r);if(refs.length>=12)break}
 $('#kgR').value=refs.join('\n');
 $('#kgS').textContent='已提取 '+refs.length+' 条候选引用（可编辑；服务端逐条经 arXiv 核实）。';
}
async function kgBuild(){
 const v=$('#kgv'),d=$('#kgd');
 v.innerHTML='<div class="empty">正在构建知识网：查询 arXiv/S2、模型归纳节点与边，约 10–30s…</div>';d.innerHTML='';d.style.display='none';
 const title=($('#kgT').value||'').trim()||(S.cur?S.cur.title:'');
 const refs=$('#kgR').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12);
 if(!title){toast('缺少论文标题');v.innerHTML='';return}
 $('#kgB').disabled=true;$('#kgS').textContent='构建中…';
 try{
  const r=await fetch('/kg/v1/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,refs:refs,n_succ:5})});
  if(!r.ok)throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,200));
  const g=await r.json();
  $('#kgS').textContent=g.note||'';
  kgRender(g);
 }catch(e){v.innerHTML='<div class="empty">构建失败：'+esc(e.message)+'</div>';$('#kgS').textContent=''}
 finally{$('#kgB').disabled=false}
}
let KG_G=null;
function kgRender(g){
 KG_G=g;
 const v=$('#kgv'),old=$('#kgov');if(old)old.remove();
 const ns=g.nodes||[],es=g.edges||[];
 v.innerHTML='';if(!ns.length)return;
 const W=Math.max(900,140+Math.max(1,ns.length)*240),H=540,span=W-140,margin=70;
 const bw=(c)=>Math.min(270,Math.max(150,(span-32*Math.max(1,c))/Math.max(1,c)));
 const band=(arr,fy)=>{const p={},c=arr.length||1,step=span/c,ww=bw(c);
  arr.forEach((n,i)=>{const x=margin+step*i+step/2;p[n.id]={x:x,y:H*fy/3+H/6,w:ww}});return p};
 const pos=Object.assign({},band(ns.filter(n=>n.side==='succ').sort((a,b)=>(a.year||0)-(b.year||0)),0),
                              band(ns.filter(n=>n.side==='root'),1),
                              band(ns.filter(n=>n.side==='pre').sort((a,b)=>(a.year||0)-(b.year||0)),2));
 const etxt={build:'奠基',extend:'扩展',inspire:'启发',challenge:'挑战'};
 const ecolor={build:'#2c6e74',extend:'#3a6ea5',inspire:'#b06a1f',challenge:'#b04040'};
 let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;margin:0 auto;max-width:none"><defs><marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#93a7b8"/></marker></defs>';
 es.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
  const tip=(GP(e.from)?esc(GP(e.from))+' → ':'')+(GP(e.to)?esc(GP(e.to)):'');
  const ec=ecolor[e.type]||'#93a7b8';
  s+='<path d="M'+a.x+' '+a.y+' C'+a.x+' '+((a.y+b.y)/2)+','+b.x+' '+((a.y+b.y)/2)+','+b.x+' '+b.y+'" fill="none" stroke="'+ec+'" stroke-width="1.6" marker-end="url(#arw)" opacity="0.85"><title>'+tip+' '+(esc(e.label||''))+'</title></path>';
  s+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-10)+'" font-size="11" fill="'+ec+'" text-anchor="middle">'+esc(e.label||'')+(e.type&&etxt[e.type]?' ·'+etxt[e.type]:'')+'</text>';});
 ns.forEach(n=>{const p=pos[n.id];if(!p)return;const root=n.side==='root';
  const t=n.title.length>18?n.title.slice(0,17)+'…':n.title;
  s+='<g data-id="'+n.id+'" style="cursor:pointer"><title>'+esc(n.title)+'</title>';
  s+='<rect x="'+(p.x-p.w/2)+'" y="'+(p.y-26)+'" width="'+p.w+'" height="52" rx="10" fill="'+(root?'#2c6e74':'#ffffff')+'" stroke="'+(root?'#2c6e74':'#9fb1c2')+'" stroke-width="'+(root?2:1)+'"/>';
  s+='<text x="'+p.x+'" y="'+(p.y-6)+'" font-size="12" font-weight="600" text-anchor="middle" fill="'+(root?'#ffffff':'#263238')+'">'+esc(t)+'</text>';
  s+='<text x="'+p.x+'" y="'+(p.y+15)+'" font-size="10.5" text-anchor="middle" fill="'+(root?'#cfe8e8':'#75879a')+'">'+(n.year||'?')+' · '+(root?'本文':(n.side==='pre'?'前驱':'后续'))+((n.tech)?(' · '+esc(n.tech)):'')+'</text></g>';});
 s+='</svg>';
 v.innerHTML=s;
 v.onclick=e=>{const gid=e.target.closest('[data-id]');if(!gid)return;const n=ns.find(x=>x.id===gid.dataset.id);if(n)kgDetail(n)};
}
function GP(id){const g=KG_G;if(!g)return'';const n=g.nodes.find(x=>x.id===id);return n?n.title:''}
function kgDetail(n){
 const old=$('#kgov');if(old)old.remove();
 const ov=document.createElement('div');ov.className='ov';ov.id='kgov';
 const dlg=document.createElement('div');dlg.className='dlg';dlg.style.maxWidth='760px';
 const chips=(n.sources||[]).map(s=>{const c=s.indexOf('模型')>=0?'#b06a1f':(s.indexOf('S2')>=0?'#2f7d43':(s.indexOf('正文')>=0?'#3a6ea5':'#2c6e74'));return '<span style="display:inline-block;background:'+c+'22;color:'+c+';border:1px solid '+c+'66;border-radius:99px;padding:0 8px;font-size:11px;margin-right:4px">'+esc(s)+'</span>'}).join('');
 const side=n.side==='root'?'本文（root）':(n.side==='pre'?'前驱（被本文引用）':'后续（引用/承接本文）');
 const rels=(KG_G&&KG_G.edges||[]).filter(e=>e.from===n.id||e.to===n.id)
  .map(e=>{const other=e.from===n.id?e.to:e.from;const ot=GP(other)||other;const dir=e.from===n.id?'→ 引出 / 影响':'← 引入 / 承接';
   const etxt={build:'奠基',extend:'扩展',inspire:'启发',challenge:'挑战'};
   const ecolor={build:'#2c6e74',extend:'#3a6ea5',inspire:'#b06a1f',challenge:'#b04040'};
   const tcol=ecolor[e.type]||'#2c6e74';
   return '<div style="border:1px solid var(--ln);border-radius:8px;padding:9px 11px;background:var(--pn2);display:flex;flex-direction:column;gap:3px">'
    +'<div><span style="color:'+tcol+';font-weight:700">'+(e.label||'')+'</span>'
    +' <span style="color:'+tcol+'">· '+((e.type&&etxt[e.type])||'')+'</span>'
    +' <span style="color:var(--mut);font-size:12px">'+dir+'</span>'
    +' <b style="font-size:12.5px">'+esc(ot)+'</b></div>'
    +(e.relation?'<div style="color:var(--mut);font-size:12.5px">'+esc(e.relation)+'</div>':'')+'</div>'}).join('');
 dlg.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
  +'<div style="font-size:13.5px;font-weight:700;line-height:1.35">'+esc(n.title)+'</div>'
  +'<button style="border:0;background:var(--pn2);color:var(--mut);font-size:18px;cursor:pointer;border-radius:6px;padding:2px 9px" onclick="this.closest(\'#kgov\').remove()">✕</button></div>'
  +'<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">'+chips+'<small style="color:var(--mut)">｜ '+side+'</small>'
  +(n.year?'<small style="color:var(--mut)">'+n.year+' 年</small>':'')
  +(n.first_author?'<small style="color:var(--mut)">'+esc(n.first_author)+'</small>':'')
  +(n.arxiv?'<a href="https://arxiv.org/abs/'+esc(n.arxiv)+'" target="_blank" style="color:var(--ac);font-size:12px">arXiv:'+esc(n.arxiv)+' ↗</a>':'')
  +'</div>'
  +'<div style="display:grid;grid-template-columns:1fr;gap:7px">'
  +'<div style="background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px"><b style="color:#2c6e74">✓ 解决了什么问题</b><div style="font-size:13px;color:var(--fg);margin-top:2px">'+esc(n.solved||n.core||'—')+'</div></div>'
  +'<div style="background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px"><b style="color:#b04040">△ 还存在什么问题</b><div style="font-size:13px;color:var(--fg);margin-top:2px">'+esc(n.open||n.problems||'—')+'</div></div>'
  +'<div style="background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px"><b style="color:#3a6ea5">⚙ 核心技术与方法</b><div style="font-size:13px;color:var(--fg);margin-top:2px">'+esc(n.tech||'—')+'</div></div>'
  +'</div>'
  +'<div style="font-size:12.5px;font-weight:700;color:var(--mut)">技术迭代 / 知识关系（'+rels.split("</div>").filter(x=>x).length+' 条）</div>'
  +(rels||'<div style="color:var(--mut);font-size:12.5px">（暂无关联关系）</div>')
  +(n.abstract?'<details style="font-size:12.5px"><summary style="cursor:pointer;color:var(--ac);font-weight:600">论文摘要</summary><div style="color:var(--mut);margin-top:4px">'+esc(n.abstract)+'</div></details>':'')
  +'</div>';
 ov.appendChild(dlg);
 ov.onclick=e=>{if(e.target===ov)ov.remove()};
 document.body.appendChild(ov);
}
$('#kgAuto').onclick=kgAuto;
$('#kgB').onclick=kgBuild;
